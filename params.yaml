data:
  raw_path: "data/raw/credit.csv"
  test_size: 0.2
  random_state: 42
  stratify: true

model:
  default_threshold: 0.5
  cost_fp: 1.0   # Relative cost of false positive (denying good applicant)
  cost_fn: 5.0   # Relative cost of false negative (approving defaulter)
  score_base: 600
  score_pdo: 40  # Points to Double the Odds (FICO style)

hyperparameters:
  random_forest:
    n_estimators: 100
    max_depth: 8
    min_samples_split: 20
    min_samples_leaf: 10
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 3.5
    eval_metric: "logloss"
    random_state: 42
    n_jobs: -1

  lightgbm:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    class_weight: "balanced"
    random_state: 42
    verbose: -1
    n_jobs: -1

  catboost:
    iterations: 300
    depth: 6
    learning_rate: 0.05
    auto_class_weights: "Balanced"
    random_state: 42
    verbose: 0
